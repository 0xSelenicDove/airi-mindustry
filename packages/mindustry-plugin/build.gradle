plugins {
    id 'java'
}

group = 'dev.airi'
version = '0.1.0'

repositories {
    mavenCentral()

    // Mindustry publishes its plugin dependency as a release artifact.
    ivy {
        url = 'https://github.com/'
        patternLayout {
            artifact '/[organisation]/[module]/releases/download/[revision]/dependencies.jar'
        }
        metadataSources {
            artifact()
        }
    }
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

dependencies {
    compileOnly 'Anuken:Mindustry:v159.7'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.11.0'
}

tasks.named('test') {
    useJUnitPlatform()
}

jar {
    archiveFileName = 'airi-mindustry-mod.jar'
}
