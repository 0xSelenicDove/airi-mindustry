name: PR checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  hygiene:
    name: Hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check patch whitespace
        run: git diff --check ${{ github.event.pull_request.base.sha }}...HEAD

  bridge:
    name: Bridge quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Type-check
        run: pnpm type-check
      - name: Build
        run: pnpm build
      - name: Run deterministic bridge tests
        run: pnpm --dir packages/bridge test

  mindustry-plugin:
    name: Mindustry plugin tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Test and build plugin
        run: >-
          gradle -p packages/mindustry-plugin
          test tddTest gatewayTddTest repairActionTddTest repairStatusTddTest jar
      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: airi-mindustry-mod
          path: packages/mindustry-plugin/build/libs/airi-mindustry-mod.jar
          if-no-files-found: error

  mindustry-v155-compatibility:
    name: Mindustry v155 compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Download the v155 desktop API JAR
        run: curl --fail --location --retry 3 https://github.com/Anuken/Mindustry/releases/download/v155/Mindustry.jar --output "$RUNNER_TEMP/Mindustry-v155.jar"
      - name: Compile mod against Mindustry v155
        run: gradle -p packages/mindustry-plugin clean jar -PmindustryJar="$RUNNER_TEMP/Mindustry-v155.jar"

  game-data-generator:
    name: Game-data generator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build generator
        run: gradle -p tools/generate-game-data build
